spring:
  application:
    name: vpndirector
  config:
    # .env рядом с jar (относительно рабочего каталога). Формат properties: комментарии — только отдельной
    # строкой, "\" — escape-символ. Реальные переменные окружения имеют приоритет над .env
    import: optional:file:.env[.properties]

app:
  server-timezone: ${SERVER_TIMEZONE:3}  # Смещение от UTC в часах (3 = UTC+3, Москва)

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    session:
      tracking-modes: cookie  # без ;jsessionid= в URL (StrictHttpFirewall отклоняет ";")

openvpn:
  server:
    openvpn-root: ${OPENVPN_ROOT:/etc/openvpn}
    config-file-name: ${OPENVPN_CONFIG_FILE_NAME:server.conf}
    config-encoding: ${OPENVPN_CONFIG_ENCODING:Windows-1251}  # Кодировка файла конфигурации (Windows-1251, UTF-8, CP866, KOI8-R и т.д.)
    easy-rsa-path: ${OPENVPN_EASY_RSA_PATH:/etc/openvpn/easy-rsa/2.0}
    status-file-name: ${OPENVPN_STATUS_FILE_NAME:openvpn-status1194.log}  # Имя файла статуса OpenVPN
    systemd-unit-prefix: ${OPENVPN_SYSTEMD_UNIT_PREFIX:openvpn-server}  # Префикс unit: openvpn-server@server или openvpn@server

security:
  user:
    name: ${SECURITY_USER_NAME:admin}
    # Обязательный: без пароля приложение не стартует (пустой пароль не допускается)
    password: ${SECURITY_USER_PASSWORD:}
  bruteforce:
    max-attempts: ${SECURITY_BRUTEFORCE_MAX_ATTEMPTS:3}
    lock-minutes: ${SECURITY_BRUTEFORCE_LOCK_MINUTES:15}
    failure-window-minutes: ${SECURITY_BRUTEFORCE_FAILURE_WINDOW_MINUTES:10}
    # Прокси, которым доверяем X-Real-IP / X-Forwarded-For (через запятую); приложение должно быть доступно только через них
    trusted-proxies: ${SECURITY_TRUSTED_PROXIES:127.0.0.1,::1}

